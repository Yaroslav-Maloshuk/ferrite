name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install protoc
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          fi
      - run: cargo fmt --check
      - run: cargo clippy --features bench --all-targets -- -D warnings
      - run: cargo build --bins --features bench
      - env:
          FERRITE_MODEL_DIR: data/models
        run: ./target/debug/ferrite prefetch
      - run: cargo test --features bench

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,           target: x86_64-unknown-linux-gnu, artifact: linux-amd64 }
          - { os: ubuntu-24.04-arm,        target: aarch64-unknown-linux-gnu, artifact: linux-arm64 }
          - { os: macos-latest,            target: aarch64-apple-darwin,      artifact: macos-arm64 }
          - { os: macos-latest,            target: x86_64-apple-darwin,       artifact: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install protoc
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y protobuf-compiler
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install protobuf
          fi
      - run: cargo build --release --bin ferrite --target ${{ matrix.target }}
      - run: cargo build --release --features bench --bin ferrite-bench --target ${{ matrix.target }}
      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/ferrite${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          cp target/${{ matrix.target }}/release/ferrite-bench${{ runner.os == 'Windows' && '.exe' || '' }} dist/
          cp LICENSE COMMERCIAL_LICENSE.md dist/
          tar -czf ferrite-${{ matrix.artifact }}.tar.gz -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ matrix.artifact }}
          path: ferrite-${{ matrix.artifact }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz