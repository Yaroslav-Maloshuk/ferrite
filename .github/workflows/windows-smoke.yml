name: windows-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98"
      - name: Install protoc
        shell: bash
        run: |
          curl -L -o "$RUNNER_TEMP/protoc.zip" https://github.com/protocolbuffers/protobuf/releases/download/v25.6/protoc-25.6-win64.zip
          mkdir -p "$RUNNER_TEMP/protoc" && unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --bin ferrite
      - name: Smoke test (prefetch, serve, ingest, search)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $env:FERRITE_LANCE_URI = "$env:RUNNER_TEMP\lance"
          $env:FERRITE_MODEL_DIR = "$env:RUNNER_TEMP\models"
          .\target\release\ferrite.exe --help | Select-Object -First 3
          .\target\release\ferrite.exe prefetch
          Set-Content "$env:RUNNER_TEMP\corpus.jsonl" '{"id":"1","text":"the cat sits on the mat"}'
          .\target\release\ferrite.exe ingest --file "$env:RUNNER_TEMP\corpus.jsonl"
          .\target\release\ferrite.exe stats
          $p = Start-Process .\target\release\ferrite.exe -ArgumentList "serve","--port","8099" -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              try { $r = Invoke-RestMethod http://localhost:8099/v1/health; $ok = ($r.status -eq "ok"); if ($ok) { break } } catch { Start-Sleep 2 }
            }
            if (-not $ok) { throw "healthcheck failed" }
            "health: ok"
            $hit = Invoke-RestMethod -Method Post http://localhost:8099/v1/search -Body '{"query":"cat","top_k":1}' -ContentType "application/json"
            $hit | ConvertTo-Json -Compress
            if ($hit.results.Count -lt 1) { throw "search returned no hits" }
            "smoke: PASS"
          } finally { Stop-Process -Id $p.Id -Force }
      - uses: actions/upload-artifact@v4
        with:
          name: ferrite-windows-x86_64
          path: target/release/ferrite.exe